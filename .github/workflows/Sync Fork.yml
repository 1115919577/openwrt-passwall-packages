name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream (full reset)
        env:
          UPSTREAM_REPO: "Openwrt-Passwall/openwrt-passwall-packages"
          TARGET_BRANCH: "main"
        run: |
          # 1. 添加上游仓库并拉取
          echo "📦 添加上游仓库：https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream

          # 2. 检查是否需要同步
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/${{ env.TARGET_BRANCH }})
          AHEAD_COUNT=$(git rev-list --count upstream/${{ env.TARGET_BRANCH }}..HEAD)

          if [ $BEHIND_COUNT -eq 0 ]; then
            echo "✅ 已是最新，无需同步"
            exit 0
          fi

          echo "📝 领先 $AHEAD_COUNT 个提交（本地修改），落后 $BEHIND_COUNT 个提交（上游更新）"

          # 3. 保存本 workflow 文件到临时目录（reset 会删掉它）
          cp ".github/workflows/Sync Fork.yml" /tmp/sync-fork.yml
          echo "💾 已备份 Sync Fork.yml"

          # 4. 强制重置为上游（完全清除所有本地修改）
          #    比 rebase 更干净：不需要处理冲突，不需要 -X ours
          #    fork 变成上游的精确副本
          echo "🔄 强制重置为上游 ${{ env.TARGET_BRANCH }} ..."
          git reset --hard upstream/${{ env.TARGET_BRANCH }}

          # 5. 删除上游引入的所有 workflow 文件，只恢复自己的
          #    GITHUB_TOKEN 无法推送 .github/workflows/ 下的文件
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/sync-fork.yml ".github/workflows/Sync Fork.yml"
          echo "✅ 已恢复 Sync Fork.yml"

          # 6. 提交并强制推送
          git add .github/workflows/
          git diff --cached --quiet || git commit -m "chore: sync with upstream, preserve Sync Fork workflow"
          git push origin ${{ env.TARGET_BRANCH }} --force

          echo "🎉 同步完成！fork 已与上游完全一致（仅保留 Sync Fork workflow）"

      - name: Show sync result
        if: always()
        run: |
          echo "📋 同步结果："
          echo "当前分支：$(git branch --show-current)"
          git log -1 --oneline
          echo ""
          echo "📊 最近5次提交："
          git log --oneline -5
